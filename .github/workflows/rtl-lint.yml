name: RTL Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Verilator RTL lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator

      - name: Lint RTL
        run: |
          verilator \
            --lint-only \
            -Wall \
            --sv \
            --top-module async_fifo \
            rtl/reset_sync.sv \
            rtl/sync_2ff.sv \
            rtl/gray_counter.sv \
            rtl/async_fifo.sv
